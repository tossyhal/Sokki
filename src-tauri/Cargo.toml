[package]
name = "sokki"
version = "0.0.0"
description = "Local recording and transcription desktop app"
authors = ["Sokki Contributors"]
edition = "2021"
license = "UNLICENSED"
rust-version = "1.77"

[lib]
name = "sokki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sokki"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.15"
crossbeam-channel = "0.5"
env_logger = "0.11"
hound = "3.5"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rubato = { version = "0.15", default-features = false }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "flac", "wav", "ogg", "vorbis"] }
sysinfo = "0.30"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
thiserror = "1"
whisper-rs = { version = "0.16" }

[features]
default = []
gpu-vulkan = ["whisper-rs/vulkan"]
