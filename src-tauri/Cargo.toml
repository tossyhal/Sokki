[package]
name = "sokki"
version = "0.0.0"
description = "Local recording and transcription desktop app"
authors = ["Sokki Contributors"]
edition = "2021"
license = "UNLICENSED"
rust-version = "1.77"

[lib]
name = "sokki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sokki"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cpal = "0.15"
crossbeam-channel = "0.5"
env_logger = "0.11"
log = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
thiserror = "1"

[features]
default = []
gpu-vulkan = []
